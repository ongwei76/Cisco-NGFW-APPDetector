[project]
name = "ngfw-appdetector"
version = "1.2.0"
description = "Windows tool that correlates local process flows with Cisco FMC events and generates Lua application detectors."
requires-python = ">=3.9"
authors = [{ name = "DL_VibeCoding" }]
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
ngfw-appdetector = "ngfw_appdetector.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ngfw_appdetector.lua_generator" = ["templates/*.lua.j2"]
"ngfw_appdetector.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
